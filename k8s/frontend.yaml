apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
  namespace: ecommerce
  labels: {app: ecommerce-frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: ecommerce-frontend}}
  template:
    metadata: {labels: {app: ecommerce-frontend, version: v1}}
    spec:
      containers:
        - name: frontend
          image: ecommerce/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          readinessProbe:
            httpGet: {path: /health, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend
  namespace: ecommerce
spec:
  selector: {app: ecommerce-frontend}
  ports:
    - name: http
      port: 80
      targetPort: 80
