apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog-service
  namespace: ecommerce
spec:
  hosts:
    - "*"
  gateways:
    - ecommerce-gateway
  http:
    - match:
        - uri:
            prefix: /api/catalog
      route:
        - destination:
            host: catalog-service.ecommerce.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: catalog-service.ecommerce.svc.cluster.local
            subset: v2
          weight: 10
      retries: {attempts: 3, perTryTimeout: 2s, retryOn: "5xx,reset,connect-failure"}
      timeout: 10s
    - route:
        - destination:
            host: catalog-service.ecommerce.svc.cluster.local
      retries: {attempts: 3, perTryTimeout: 2s, retryOn: "5xx,reset,connect-failure"}
      timeout: 10s
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog-service-mesh
  namespace: ecommerce
spec:
  hosts:
    - catalog-service.ecommerce.svc.cluster.local
  gateways:
    - mesh
  http:
    - match:
        - uri:
            prefix: /api/catalog
      route:
        - destination:
            host: catalog-service.ecommerce.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: catalog-service.ecommerce.svc.cluster.local
            subset: v2
          weight: 10
      retries: {attempts: 3, perTryTimeout: 2s, retryOn: "5xx,reset,connect-failure"}
      timeout: 10s
    - route:
        - destination:
            host: catalog-service.ecommerce.svc.cluster.local
      retries: {attempts: 3, perTryTimeout: 2s, retryOn: "5xx,reset,connect-failure"}
      timeout: 10s
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalog-service
  namespace: ecommerce
spec:
  host: catalog-service.ecommerce.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
