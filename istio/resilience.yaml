apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: user-service, namespace: ecommerce}
spec:
  host: user-service.ecommerce.svc.cluster.local
  trafficPolicy:
    connectionPool: {tcp: {maxConnections: 100}, http: {http1MaxPendingRequests: 100}}
    outlierDetection: {consecutive5xxErrors: 3, interval: 30s, baseEjectionTime: 30s, maxEjectionPercent: 50}
---
