apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: ecommerce-prometheus-metrics
  namespace: ecommerce
spec:
  tracing:
    - providers:
        - name: jaeger
      randomSamplingPercentage: 100.0
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: REQUEST_COUNT
          tagOverrides:
            destination_service:
              operation: UPSERT
              value: '"{{.destination_service_name}}"'
